<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Web</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">TOKO WEB</div>
    <a href="/logout" class="logout">Keluar</a>
  </nav>

  <main class="container">

    <section class="hero">
      <h1>Selamat Datang 👋</h1>
      <p>Pilih server yang ingin kamu pesan.</p>
    </section>

    <section class="server-section">

      <div class="section-title">
        <h2>Server</h2>
        <button class="add-server" onclick="addServer()">
          + Tambahkan Server
        </button>
      </div>

      <div id="serverList">

        <div class="server-card">
          <div>
            <span class="status">● ONLINE</span>
            <h3>Server 1</h3>
            <p>Server utama</p>
          </div>

          <button class="buy-button" onclick="buyServer('Server 1')">
            Beli Sekarang
          </button>
        </div>

      </div>

    </section>

  </main>

  <script>
    async function buyServer(serverName) {
      try {
        const response = await fetch("/api/orders", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            product: serverName
          })
        });

        const data = await response.json();

        if (!response.ok) {
          alert(data.message || "Gagal membuat pesanan.");
          return;
        }

        window.location.href = data.redirect;

      } catch (error) {
        alert("Terjadi kesalahan koneksi.");
      }
    }

    function addServer() {
      alert("Fitur Tambahkan Server akan kita buat berikutnya.");
    }
  </script>

</body>
</html>
