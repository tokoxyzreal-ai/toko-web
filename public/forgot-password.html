<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lupa Password - Toko Web</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
.card{
  width:100%;
  max-width:420px;
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.08)
}
h1{margin:0 0 8px;font-size:25px}
p{color:#667085;font-size:14px;line-height:1.5}
label{display:block;margin:22px 0 8px;font-weight:700;font-size:14px}
input{
  width:100%;
  padding:13px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  font-size:15px;
  outline:none
}
input:focus{border-color:#1769e0}
button{
  width:100%;
  margin-top:18px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#1769e0;
  color:white;
  font-size:15px;
  font-weight:700
}
button:disabled{opacity:.6}
#message{
  margin-top:15px;
  padding:11px;
  border-radius:9px;
  display:none;
  font-size:14px
}
.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#1769e0;
  text-decoration:none;
  font-size:14px;
  font-weight:700
}
</style>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="card">
  <h1>Lupa Password?</h1>
  <p>Masukkan email yang terdaftar. Kami akan mengirim kode verifikasi 6 digit.</p>

  <form id="forgotForm">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="nama@email.com" required>

    <button id="btn" type="submit">Lanjutkan</button>
  </form>

  <div id="message"></div>

  <a class="back" href="/login.html">← Kembali ke Login</a>
</div>

<script>
const form = document.getElementById("forgotForm");
const email = document.getElementById("email");
const btn = document.getElementById("btn");
const message = document.getElementById("message");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  message.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Mengirim...";

  try {
    const response = await fetch("/forgot-password", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        email: email.value.trim().toLowerCase()
      })
    });

    const data = await response.json();

    message.textContent = data.message || "Permintaan selesai.";
    message.style.display = "block";

    if (data.ok && data.redirect) {
      setTimeout(() => {
        location.href = data.redirect;
      }, 800);
    }

  } catch (error) {
    message.textContent = "Tidak dapat terhubung ke server.";
    message.style.display = "block";
  }

  btn.disabled = false;
  btn.textContent = "Lanjutkan";
});
</script>

</body>
</html>
