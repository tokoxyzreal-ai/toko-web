<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - TokoWeb</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(circle at 15% 20%,rgba(0,140,255,.28),transparent 30%),
radial-gradient(circle at 85% 80%,rgba(0,70,255,.22),transparent 30%),
#020711;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
overflow:hidden;
}

body:after{
content:"";
position:fixed;
inset:0;
background:linear-gradient(120deg,transparent 45%,rgba(0,140,255,.06),transparent 55%);
animation:scan 5s linear infinite;
pointer-events:none;
}

@keyframes scan{
0%{transform:translateX(-100%)}
100%{transform:translateX(100%)}
}

.card{
position:relative;
width:100%;
max-width:410px;
padding:32px 27px;
background:rgba(255,255,255,.97);
color:#071426;
border:1px solid rgba(0,145,255,.55);
border-radius:22px;
box-shadow:
0 0 25px rgba(0,130,255,.25),
0 0 70px rgba(0,80,255,.12);
}

.card:before{
content:"";
position:absolute;
inset:-1px;
border-radius:22px;
padding:1px;
background:linear-gradient(135deg,#168cff,transparent,#005bea);
-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
-webkit-mask-composite:xor;
mask-composite:exclude;
pointer-events:none;
}

.logo{
text-align:center;
font-size:29px;
font-weight:900;
color:#087ff5;
letter-spacing:.5px;
margin-bottom:7px;
text-shadow:0 0 14px rgba(8,127,245,.25);
}

.subtitle{
text-align:center;
color:#66758a;
margin-bottom:25px;
font-size:14px;
}

label{
display:block;
margin:16px 0 7px;
font-size:14px;
font-weight:700;
color:#17283b;
}

input{
width:100%;
height:50px;
padding:0 14px;
border:2px solid #c8ddf5;
border-radius:12px;
outline:none;
background:#f5faff;
color:#071426;
font-size:15px;
transition:.2s;
box-shadow:inset 0 0 10px rgba(0,100,255,.05);
}

input::placeholder{color:#8998aa}

input:focus{
border-color:#087ff5;
background:#fff;
box-shadow:
0 0 0 3px rgba(8,127,245,.12),
0 0 20px rgba(8,127,245,.2);
}

.message{
display:none;
margin-top:15px;
padding:12px 14px;
border-radius:10px;
font-size:13px;
line-height:1.4;
}

.message.error{
display:block;
background:#fff1f1;
color:#c62828;
border:1px solid #ffd0d0;
}

.message.success{
display:block;
background:#effaf3;
color:#198754;
border:1px solid #c9efd8;
}

button{
width:100%;
height:50px;
margin-top:20px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#087ff5,#005bea);
color:#fff;
font-size:15px;
font-weight:800;
cursor:pointer;
box-shadow:0 8px 25px rgba(0,110,240,.3);
transition:.2s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 0 25px rgba(0,130,255,.55);
}

button:disabled{
opacity:.65;
cursor:not-allowed;
}

.bottom{
text-align:center;
margin-top:20px;
color:#718096;
font-size:14px;
}

.bottom a,a{
color:#087ff5;
text-decoration:none;
font-weight:700;
}

.bottom a:hover,a:hover{text-decoration:underline}

@media(max-width:480px){
.card{
padding:27px 21px;
border-radius:18px;
}
}
</style>
<link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="card">

  <div class="logo">TokoWeb</div>

  <div class="subtitle">
    Masuk ke akun Anda
  </div>

  <form id="loginForm">

    <label>Username</label>
    <input
      id="username"
      name="username"
      type="text"
      placeholder="Masukkan username"
      autocomplete="username"
      required
    >

    <label>Password</label>
    <input
      id="password"
      name="password"
      type="password"
      placeholder="Masukkan password"
      autocomplete="current-password"
      required
    >

    <label style="display:flex;align-items:center;gap:8px;margin-top:15px;font-weight:normal;cursor:pointer;">
      <input id="rememberMe" type="checkbox" style="width:auto;">
      <span>Ingat saya</span>
    </label>

    <div class="message" id="message"></div>

    <button id="loginButton" type="submit">
      Login
    </button>

  </form>

<div style="text-align:right;margin-top:14px;"><a href="/forgot-password.html" style="color:#1769e0;text-decoration:none;font-size:13px;font-weight:700;">Lupa password?</a></div>
  <div class="bottom">
    Belum punya akun?
    <a href="/register.html">Daftar sekarang</a>
  </div>

</div>

<script>
(async()=>{try{const r=await fetch("/api/me");if(r.ok){const d=await r.json();if(d.ok)location.href="/dashboard.html"}}catch(e){}})();
const form = document.getElementById("loginForm");
const username = document.getElementById("username");
const password = document.getElementById("password");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");
const rememberMe = document.getElementById("rememberMe");

function showError(text){
  message.className = "message error";
  message.textContent = text;
}

function showSuccess(text){
  message.className = "message success";
  message.textContent = text;
}

form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  message.className = "message";
  message.textContent = "";

  if(!username.value.trim()){
    showError("Username wajib diisi.");
    username.focus();
    return;
  }

  if(!password.value){
    showError("Password wajib diisi.");
    password.focus();
    return;
  }

  button.disabled = true;
  button.textContent = "Memproses...";

  try{
    const response = await fetch("/login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        username:username.value.trim(),
        password:password.value,
        rememberMe:rememberMe.checked
      })
    });

    let data;

    try{
      data = await response.json();
    }catch{
      data = {
        ok:false,
        message:"Respons server tidak valid."
      };
    }

    if(!response.ok || !data.ok){
      showError(data.message || "Login gagal.");
      button.disabled = false;
      button.textContent = "Login";
      return;
    }

    showSuccess("Login berhasil! Mengalihkan...");

    setTimeout(()=>{
      window.location.href =
        data.redirect || "/dashboard.html";
    },500);

  }catch(error){
    showError("Tidak dapat terhubung ke server.");
    button.disabled = false;
    button.textContent = "Login";
  }
});
</script>

</body>
</html>
