<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Baru - Toko Web</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:#fff;padding:30px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{margin:0 0 8px}
p{color:#667085;font-size:14px;line-height:1.5}
label{display:block;margin-top:20px;margin-bottom:8px;font-size:14px;font-weight:700}
input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px}
button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-weight:700}
button:disabled{opacity:.65}
#message{margin-top:15px;font-size:14px}
</style>
</head>
<body>

<div class="card">
<h1>Password Baru</h1>
<p>Buat password baru untuk akun kamu. Minimal 6 karakter.</p>

<form id="form">
<label>Password baru</label>
<input id="password" type="password" minlength="6" required>

<label>Ulangi password</label>
<input id="confirm" type="password" minlength="6" required>

<button id="btn" type="submit">Simpan Password</button>
</form>

<div id="message"></div>
</div>

<script>
const form=document.getElementById("form");
const password=document.getElementById("password");
const confirm=document.getElementById("confirm");
const btn=document.getElementById("btn");
const message=document.getElementById("message");

form.addEventListener("submit",async e=>{
 e.preventDefault();

 message.textContent="";

 if(password.value.length<6){
  message.textContent="Password minimal 6 karakter.";
  return;
 }

 if(password.value!==confirm.value){
  message.textContent="Password tidak sama.";
  return;
 }

 btn.disabled=true;
 btn.textContent="Menyimpan...";

 const controller=new AbortController();
 const timeout=setTimeout(()=>{
  controller.abort();
 },8000);

 try{
  const r=await fetch("/reset-password",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    password:password.value
   }),
   signal:controller.signal
  });

  clearTimeout(timeout);

  let d;

  try{
   d=await r.json();
  }catch{
   d={
    ok:false,
    message:"Respons server tidak valid."
   };
  }

  message.textContent=d.message||"Selesai.";

  if(d.ok){
   btn.textContent="Berhasil!";
   setTimeout(()=>{
    location.href="/login.html?reset=1";
   },800);
   return;
  }

 }catch(e){

  if(e.name==="AbortError"){
   message.textContent="Server terlalu lama merespons. Silakan coba lagi.";
  }else{
   message.textContent="Tidak dapat terhubung ke server.";
  }

 }finally{
  btn.disabled=false;

  if(btn.textContent==="Menyimpan..."){
   btn.textContent="Simpan Password";
  }
 }
});
</script>

</body>
</html>
